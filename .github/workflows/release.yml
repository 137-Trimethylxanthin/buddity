# Builds Verity for Windows, Linux and macOS when a version tag (v1.2.3) is
# pushed, and publishes installers + signed updater files to the public
# verity-releases repo, where the app's auto-updater looks for them.
#
# Repo secrets needed:
#   TAURI_SIGNING_PRIVATE_KEY            contents of ~/.tauri/verity.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   contents of ~/.tauri/verity.key.password
#   RELEASES_TOKEN                       fine-grained token with Contents: read & write on verity-releases

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-layer-shell-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: 137-Trimethylxanthin
          repo: verity-releases
          tagName: v__VERSION__
          releaseName: Verity v__VERSION__
          releaseBody: "Download the installer for your system below. Already installed? Verity updates himself."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
