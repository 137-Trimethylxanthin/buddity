# Builds Verity for Windows, Linux and macOS when a version tag (v1.2.3) is
# pushed, and publishes the installers as release "verity-v1.2.3" in the
# public, shared "releases" repo. Because that repo holds releases of several
# projects, the app can't use "latest"; it reads latest.json from the fixed
# "verity-updater" release, which the last job refreshes.
#
# Actions are pinned to commits: they run with the signing key and releases token.
#
# Repo secrets needed:
#   TAURI_SIGNING_PRIVATE_KEY            contents of ~/.tauri/verity.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   contents of ~/.tauri/verity.key.password
#   RELEASES_TOKEN                       fine-grained token with Contents: read & write on the releases repo

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-layer-shell-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: 137-Trimethylxanthin
          repo: releases
          tagName: verity-v__VERSION__
          releaseName: Verity v__VERSION__
          releaseBody: "Download the installer for your system below. Already installed? Verity updates himself."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  updater:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      REPO: 137-Trimethylxanthin/releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point the updater at this version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          gh release download "verity-v$VERSION" -R "$REPO" -p latest.json
          gh release view verity-updater -R "$REPO" >/dev/null 2>&1 || gh release create verity-updater -R "$REPO" \
            --title "Verity auto-updater (internal)" --latest=false \
            --notes "Used by Verity's auto-updater. To download Verity, pick the newest verity-v* release."
          gh release upload verity-updater latest.json -R "$REPO" --clobber
