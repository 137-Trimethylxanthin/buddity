[package]
name = "verity"
version = "0.2.1"
description = "Verity - an unofficial fan-made desktop assistant"
edition = "2021"

[lib]
name = "verity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
enigo = { version = "0.6", default-features = false }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
enigo = { version = "0.6", default-features = false, features = ["x11rb", "wayland"] }
