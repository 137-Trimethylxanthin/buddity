<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verity settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffbea;
        --fg: #2b2410;
        --muted: #7a6c45;
        --line: #eadfb8;
        --accent: #f2c200;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d1a12;
          --fg: #f3ecd3;
          --muted: #a89a72;
          --line: #3a3423;
        }
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, sans-serif;
        user-select: none;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 18px;
      }
      label {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      label[hidden] {
        display: none;
      }
      input {
        margin: 2px 0 0;
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
        flex: none;
      }
      .update {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      button {
        align-self: flex-start;
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--accent);
        color: #2b2410;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      small {
        display: block;
        color: var(--muted);
      }
      h2 {
        margin: 18px 0 4px;
        font-size: 15px;
      }
      .wardrobe {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin: 8px 0 18px;
      }
      .wardrobe button {
        align-self: stretch;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 6px 2px;
        background: transparent;
        color: var(--fg);
        font-size: 11px;
        line-height: 1.2;
      }
      .wardrobe button span {
        font-size: 24px;
        line-height: 1.1;
      }
      .wardrobe button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #2b2410;
      }
    </style>
    <script type="module" src="/src/settings.ts"></script>
  </head>
  <body>
    <h1>Verity settings 💛</h1>
    <h2>Wardrobe</h2>
    <small>One hat, one pair of glasses and one neck thing at a time.</small>
    <div class="wardrobe" id="wardrobe"></div>
    <label><input type="checkbox" data-key="sound" /><span>Sound<small>His voice, songs and noises.</small></span></label>
    <label><input type="checkbox" data-key="pester" /><span>Pester<small>Ignore him for 5 minutes and he pushes your cursor around and scrolls your page.</small></span></label>
    <label><input type="checkbox" data-key="autostart" /><span>Start with PC<small>He starts when you log in.</small></span></label>
    <label><input type="checkbox" data-key="screens" /><span>All screens<small>With more than one screen he wanders, gets thrown and dragged from one to the next.</small></span></label>
    <label><input type="checkbox" data-key="windows" /><span>Climb windows<small>He stands on your windows, goes inside them and knows which app he's next to. He only sees app names, never what's in the windows.</small></span></label>
    <label><input type="checkbox" data-key="music" /><span>Music<small>He notices what you're playing (Spotify, YouTube, any player) and dances along. This stays on your PC.</small></span></label>
    <label><input type="checkbox" data-key="lyrics" /><span>Sing along<small>Looks up the lyrics and the tempo so he can sing and dance in time. The song's title and artist are sent to lrclib.net and deezer.com.</small></span></label>
    <label><input type="checkbox" data-key="discord" /><span>Discord status<small>Shows "Verity" on your Discord profile while he's running.</small></span></label>
    <label hidden><input type="checkbox" data-key="jumpscare" /><span>Crashout jumpscare<small>When he comes back after you "closed" him, he zooms at you.</small></span></label>
    <div class="update">
      <button id="check-update" type="button">Check for updates</button>
      <small id="update-status"></small>
    </div>
  </body>
</html>
